---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kube-homelab
  namespace: cert-manager
spec:
  isCA: true
  dnsNames:
    - kube.ag
    - "*.kube.ag"
  commonName: kube-homelab
  secretName: kube-homelab-tls
  usages:
    - digital signature
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
